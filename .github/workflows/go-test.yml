#
# This GitHub action runs the plugin's unit tests.
#
name: "Go Test"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count 1 ./... -timeout=3m
